name: Enrichir le catalogue Échappées
on:
  push:
    branches: [main]
    paths:
      - 'generator/src/**'
      - 'generator/config.json'
      - 'generator/editorial-topics.json'
      - 'generator/feeds.json'
  schedule:
    - cron: '17 1,5,9 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation sans appel OpenAI ni publication'
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: echappees-generation
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || vars.GENERATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.publish.outputs.deploy }}
      incomplete: ${{ steps.generation.outputs.incomplete }}
    env:
      GENERATION_ENABLED: ${{ vars.GENERATION_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.4'
          extensions: curl, mbstring, dom, simplexml, gd
          coverage: none
      - name: Vérifier le code et les données avant les appels
        run: |
          find generator -name '*.php' -print0 | xargs -0 -n1 php -l
          php generator/tests/run.php
          php generator/cli.php validate
          php generator/cli.php plan
      - name: Résumer la simulation
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          {
            echo '### Simulation réussie'
            echo 'Le code, les tests et le catalogue ont été vérifiés.'
            echo 'Aucun appel OpenAI, aucune réservation de budget et aucune publication ne sont effectués en simulation.'
            echo 'Les étapes de génération et le job Pages sont donc volontairement ignorés.'
            echo 'Pour générer réellement, ajouter le secret Actions OPENAI_API_KEY dans echappees-data, définir la variable Actions GENERATION_ENABLED=true, puis lancer un nouveau workflow avec dry_run désactivé.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Vérifier la présence du secret sans l'afficher
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error title=Secret OpenAI absent::Le workflow ne reçoit pas le secret OPENAI_API_KEY. Dans echappees-data, ouvrir Settings → Secrets and variables → Actions → Secrets, puis créer un Repository secret nommé OPENAI_API_KEY. Une variable Actions ne remplace pas ce secret. Aucun appel payant effectué.'
            exit 1
          fi
      - name: Réserver et enregistrer le budget avant toute dépense
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        run: |
          php generator/cli.php reserve
          git config user.name 'echappees-content[bot]'
          git config user.email 'echappees-content[bot]@users.noreply.github.com'
          git add generator/state/
          if ! git diff --cached --quiet; then
            git commit -m 'Réserver le budget de génération'
            git push origin HEAD:main
          fi
      - name: Collecter, rédiger et contrôler les publications
        id: generation
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: php generator/cli.php generate
      - name: Sauvegarder le résultat et les coûts même après une erreur
        id: publish
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        env:
          GENERATION_OUTCOME: ${{ steps.generation.outcome }}
        run: |
          git config user.name 'echappees-content[bot]'
          git config user.email 'echappees-content[bot]@users.noreply.github.com'
          git add generator/state/
          if [ "$GENERATION_OUTCOME" = success ]; then
            php generator/cli.php validate
            git add data/
            if ! git diff --cached --quiet -- data/; then
              echo 'deploy=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Enregistrer les publications validées et les coûts'
            git push origin HEAD:main
          fi
  pages:
    needs: generate
    if: needs.generate.outputs.deploy == 'true'
    uses: ./.github/workflows/pages.yml
  quota:
    needs: [generate, pages]
    if: always() && needs.generate.result == 'success' && needs.generate.outputs.incomplete == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Signaler le quota incomplet après publication des articles validés
        run: |
          echo '::error title=Quota quotidien incomplet::Les articles validés ont été conservés. Le prochain passage complétera uniquement les places restantes, sous les mêmes plafonds de budget et de contrôle.'
          exit 1
