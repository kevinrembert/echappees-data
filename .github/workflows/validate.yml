name: Vérifier PHP et le catalogue
on:
  push:
    branches: [main]
    paths: ['generator/**', 'data/**', '.github/workflows/**']
  pull_request:
    paths: ['generator/**', 'data/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.4'
          extensions: curl, mbstring, dom, simplexml, gd
          coverage: none
      - run: find generator -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php generator/tests/run.php
      - run: php generator/cli.php validate
      - name: Diagnostic des métadonnées publiques sans appel OpenAI
        if: github.event_name == 'push'
        run: php generator/cli.php probe
